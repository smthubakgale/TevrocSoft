<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact TevrocSoft | Software Development Company South Africa</title>

    <!-- Favicon -->
    <link rel="icon" href="img/favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">

    <meta name="description" content="Contact TevrocSoft to discuss your next custom software, web or mobile app project.">
    <meta name="keywords" content="contact TevrocSoft, software enquiry, custom software quote, web project contact">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://tevrocsoft.co.za/contact.html">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact TevrocSoft | Software Development Company South Africa">
    <meta property="og:description" content="Contact TevrocSoft to discuss your next custom software, web or mobile app project.">
    <meta property="og:url" content="https://tevrocsoft.co.za/contact.html">
    <meta property="og:image" content="https://tevrocsoft.co.za/img/logo.svg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact TevrocSoft | Software Development Company South Africa">
    <meta name="twitter:description" content="Contact TevrocSoft to discuss your next custom software, web or mobile app project.">
    <meta name="twitter:image" content="https://tevrocsoft.co.za/img/logo.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>

    <main class="container mx-auto px-4 py-20">
        <section class="mb-16 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Let’s build something valuable</h1>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto">Tell us about your idea, product, and goals. We’ll help shape the right solution for your team.</p>
        </section>

        <section class="mb-16">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="space-y-6">
                    <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition duration-300">
                        <div class="flex items-start">
                            <div class="bg-blue-100 p-3 rounded-full mr-4"><i data-feather="map-pin" class="text-blue-600 w-6 h-6"></i></div>
                            <div><h3 class="text-xl font-bold mb-2">Location</h3><p class="text-gray-600">Johannesburg, South Africa</p></div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition duration-300">
                        <div class="flex items-start">
                            <div class="bg-blue-100 p-3 rounded-full mr-4"><i data-feather="mail" class="text-blue-600 w-6 h-6"></i></div>
                            <div><h3 class="text-xl font-bold mb-2">Email</h3><p class="text-gray-600">info@tevrocsoft.co.za</p></div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition duration-300">
                        <div class="flex items-start">
                            <div class="bg-blue-100 p-3 rounded-full mr-4"><i data-feather="phone" class="text-blue-600 w-6 h-6"></i></div>
                            <div><h3 class="text-xl font-bold mb-2">Call</h3><p class="text-gray-600">066 2531653</p></div>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2 bg-white rounded-lg shadow-md p-8">
                    <h3 class="text-2xl font-bold mb-6">Start your project</h3>
                    <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-1"><label class="block text-gray-700 font-medium">Your Name <span class="text-red-500">*</span></label><input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required></div>
                        <div class="space-y-1"><label class="block text-gray-700 font-medium">Your Email <span class="text-red-500">*</span></label><input type="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required></div>
                        <div class="space-y-1"><label class="block text-gray-700 font-medium">Project Type</label><input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></div>
                        <div class="space-y-1"><label class="block text-gray-700 font-medium">Timeline</label><input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></div>
                        <div class="md:col-span-2 space-y-1"><label class="block text-gray-700 font-medium">Project Details <span class="text-red-500">*</span></label><textarea rows="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required></textarea></div>
                        <div class="md:col-span-2"><button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition duration-300">Send Project Brief</button></div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <custom-footer></custom-footer>

    <script>
        feather.replace();
    </script>
    <script src="script.js"></script>
</body>
</html>
